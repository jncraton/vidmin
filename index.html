<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title></title>
    <style>
      iframe {
        border: 0px;
        position: absolute;
        top: 0px;
        left: 0px;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <iframe
      id="iframe"
      width="100%"
      height="100%"
      allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen"
    ></iframe>
    <script>
      let url = location.hash.slice(1);

      if (url.includes("youtube")) {
        let id = url.match(/(?:v=|\/embed\/|youtu\.be\/)([A-Za-z0-9_-]+)/)[1];

        iframe.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&color=white&rel=0`;
      }
    </script>
  </body>
</html>
